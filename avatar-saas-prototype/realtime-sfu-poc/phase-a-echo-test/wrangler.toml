name = "avtr-realtime-sfu-poc"
main = "worker.ts"
compatibility_date = "2025-07-18"

# App ID is not secret — safe to keep in vars.
# Fill this in with your Cloudflare Realtime App ID from the dashboard.
[vars]
CALLS_APP_ID = "5d439fee94c0fab577b575253427bc98"

# Static assets: index.html and any other browser files.
# Worker runs first for ALL requests; it handles /api/* directly and
# delegates everything else to the assets binding (index.html).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ----------------------------------------------------------------------------
# Secrets — NEVER put these in this file. Set via:
#   Local:   create .dev.vars (see .dev.vars.example)
#   Deploy:  npx wrangler secret put CALLS_APP_SECRET
#            npx wrangler secret put POC_ACCESS_TOKEN
#
# Required secrets:
#   CALLS_APP_SECRET  — from Cloudflare Realtime dashboard
#   POC_ACCESS_TOKEN  — any random string you choose (gate for /api/* access)
# ----------------------------------------------------------------------------
