name = "avtr-phase-c-subscriber"
main = "worker.ts"
compatibility_date = "2025-07-18"

# All credentials in .dev.vars (not committed):
#   CALLS_APP_ID
#   CALLS_APP_SECRET
#   POC_ACCESS_TOKEN

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Dev server port — 8789 to avoid conflict with Phase A (8787) and Phase B (8788).
[dev]
port = 8789
